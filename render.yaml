# Render blueprint: web service (Docker) + managed PostgreSQL.
services:
  - type: web
    name: trustvault
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: trustvault-db, property: connectionString}
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: STORAGE_DIR
        value: /data/storage
      - key: PUBLIC_URL
        sync: false            # e.g. https://trustvault.onrender.com
      - key: ADMIN_EMAIL
        sync: false            # first administrator (you)
      - key: ADMIN_PASSWORD
        sync: false            # choose a strong password (12+ characters)
      - key: GOOGLE_CLIENT_ID
        sync: false            # optional: enables "Continue with Google"
      - key: SMTP_HOST
        sync: false            # optional: email notifications (approvals etc.)
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
    disk:            # persistent disk keeps uploaded files across deploys (paid plans)
      name: trustvault-files
      mountPath: /data
      sizeGB: 1
databases:
  - name: trustvault-db
    plan: free
